[package]
name = "gitcraft-compat"
description = "Temporary HTTP server over gitcraft-core, for the golden tests and the old UI. Deleted at cutover."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
gitcraft-core = { path = "../gitcraft-core" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }

[lints]
workspace = true
