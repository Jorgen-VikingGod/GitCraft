[package]
name = "gitcraft-core"
description = "Git layer of GitCraft: runs the git CLI and parses its output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Shared Craft libraries (MIT OR Apache-2.0), pinned to the same commit of https://github.com/storytold/craft-libs 
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "48c57b5fafa170eb9c77c1d9fef0be0f09876f1f" }
dirs = "6"
dunce = "1"
# Only for reading .gitignore rules in the watcher; git itself is always the CLI.
ignore = "0.4"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
