[package]
name = "gitcraft-ui"
description = "GitCraft, an open-source, cross-platform graphical Git client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "gitcraft"
path = "src/main.rs"

[dependencies]
# Shared Craft libraries (MIT OR Apache-2.0), pinned to the same commit of https://github.com/storytold/craft-libs 
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-automation = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9", features = ["ui"] }
craft-behavior = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-host = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-keymap = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9", features = ["egui"] }
craft-menu = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-platform = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9", features = ["appearance"] }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9", features = ["ui"] }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-theme = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9" }
craft-window = { git = "https://github.com/storytold/craft-libs", rev = "e9da0dfb37ab5e35c4c6f35949b36f09b8dcfcf9", features = ["ui"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gitcraft-core = { path = "../gitcraft-core" }
eframe = { version = "=0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
# `experimental`: the widget theme hook, for field borders and selected rows (theme.rs).
egui = { version = "=0.37.0", features = ["experimental"] }
egui_extras = { version = "=0.37.0", default-features = false, features = ["svg"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
opener = { version = "0.8", features = ["reveal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

# Windows draws with wgpu (Direct3D 12) by default: OpenGL drivers there are often slow. See `lib.rs`.
[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu"] }

[dev-dependencies]
dunce = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

# Installers are made with cargo-packager. The release workflow on GitHub runs this.
[package.metadata.packager]
product-name = "GitCraft"
identifier = "io.github.gitcraft.desktop"
category = "DeveloperTool"
description = "Open-source, cross-platform Git GUI"
homepage = "https://github.com/Jorgen-VikingGod/GitCraft"
authors = ["Jürgen Könnemann"]
publisher = "Jürgen Könnemann"
copyright = "Copyright © 2026 Jürgen Könnemann"
icons = ["assets/icon.ico", "assets/icon-512@2x.png", "assets/icon-512.png", "assets/icon-256.png", "assets/icon-128.png", "assets/icon-32.png"]
out-dir = "../../target/packages"
before-packaging-command = "cargo build --release --locked -p gitcraft-ui"
binaries = [{ path = "gitcraft", main = true }]

[package.metadata.packager.deb]
depends = ["git", "libxkbcommon0", "libwayland-client0", "libgl1"]

# Unsigned builds still need an ad-hoc signature: Apple Silicon refuses to run anything else.
[package.metadata.packager.macos]
signing-identity = "-"
