[package]
name = "gitcraft-ui"
description = "GitCraft, an open-source, cross-platform graphical Git client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "gitcraft"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gitcraft-core = { path = "../gitcraft-core" }
eframe = { version = "=0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
egui = "=0.37.0"
egui_extras = { version = "=0.37.0", default-features = false, features = ["svg"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
native-theme = { version = "=0.7.0", features = ["native"] }
opener = { version = "0.8", features = ["reveal"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
dunce = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

# Installers are made with cargo-packager. The release workflow on GitHub runs this.
[package.metadata.packager]
product-name = "GitCraft"
identifier = "io.github.gitcraft.desktop"
category = "DeveloperTool"
description = "Open-source, cross-platform Git GUI"
homepage = "https://github.com/Jorgen-VikingGod/GitCraft"
authors = ["Jürgen Könnemann"]
publisher = "Jürgen Könnemann"
copyright = "Copyright © 2026 Jürgen Könnemann"
icons = ["assets/icon.ico", "assets/icon-512@2x.png", "assets/icon-512.png", "assets/icon-256.png", "assets/icon-128.png", "assets/icon-32.png"]
out-dir = "../../target/packages"
before-packaging-command = "cargo build --release --locked -p gitcraft-ui"
binaries = [{ path = "gitcraft", main = true }]

[package.metadata.packager.deb]
depends = ["git", "libxkbcommon0", "libwayland-client0", "libgl1"]

# Unsigned builds still need an ad-hoc signature: Apple Silicon refuses to run anything else.
[package.metadata.packager.macos]
signing-identity = "-"
