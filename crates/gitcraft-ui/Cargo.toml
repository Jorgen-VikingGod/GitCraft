[package]
name = "gitcraft-ui"
description = "GitCraft, an open-source, cross-platform graphical Git client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "gitcraft"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gitcraft-core = { path = "../gitcraft-core" }
iced = { version = "=0.14.0", features = ["advanced", "canvas", "svg", "tokio"] }
native-theme-iced = { version = "=0.7.0", features = ["native", "watch"] }
opener = { version = "0.8", features = ["reveal"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
dunce = "1"
iced_runtime = "=0.14.0"
iced_test = "=0.14.0"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

[package.metadata.packager]
product-name = "GitCraft"
identifier = "io.github.gitcraft.desktop"
category = "DeveloperTool"
description = "Open-source, cross-platform Git GUI"
authors = ["Jürgen Könnemann"]
copyright = "Copyright © 2026 Jürgen Könnemann"
icons = ["assets/icon.png"]
out-dir = "../../target/packages"
before-packaging-command = "cargo build --release -p gitcraft-ui"
binaries = [{ path = "gitcraft", main = true }]

[package.metadata.packager.deb]
depends = ["git"]

# Unsigned builds still need an ad-hoc signature: Apple Silicon refuses to run anything else.
[package.metadata.packager.macos]
signing-identity = "-"
