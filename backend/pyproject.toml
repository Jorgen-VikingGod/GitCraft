[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gitcraft"
version = "0.1.0"
description = "Open-source, cross-platform Git GUI (Angular + Litestar)"
license = { text = "MIT" }
authors = [{ name = "Jürgen Könnemann" }]
requires-python = ">=3.10"
dependencies = [
    "litestar[standard]>=2.12,<3",
    "watchfiles>=0.24",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]
bundle = ["pyinstaller>=6.16"]

[project.scripts]
gitcraft = "gitcraft.app:main"

[tool.setuptools.packages.find]
include = ["gitcraft*"]

[tool.setuptools.package-data]
gitcraft = ["static/**/*", "git/editor_helper.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::litestar.utils.deprecation.LitestarDeprecationWarning"]
