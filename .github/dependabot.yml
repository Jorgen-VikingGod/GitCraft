# Keeps the actions in .github/workflows/ up to date. They are pinned to commits
# (with the version as a comment), the same pins as in HybridSliceCraft; this
# opens one pull request that moves the pins together.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
    # Wait a week after a release before proposing it.
    cooldown:
      default-days: 7
