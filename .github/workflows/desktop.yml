# Tests GitCraft on Linux, macOS and Windows and builds the desktop installers.
# Installers are attached to the workflow run as artifacts.
name: Desktop app

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Backend tests
        run: |
          python -m pip install -e "./backend[dev]"
          python -m pytest backend -q

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npx ng test --watch=false

      - name: Build installers
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned builds; configure signing secrets to sign
        run: |
          npm ci
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: gitcraft-${{ runner.os }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
          if-no-files-found: error
