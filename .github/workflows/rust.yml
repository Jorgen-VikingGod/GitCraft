# Tests the Rust port on Linux, macOS and Windows, and replays the goldens against it.
name: Rust

on:
  push:
    branches: [rust-migration]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, formats: 'deb,appimage' }
          - { os: ubuntu-24.04-arm, formats: 'deb,appimage' }
          - { os: macos-latest, formats: 'dmg' }
          - { os: windows-latest, formats: 'nsis' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ matrix.os }}-
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Lint
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Replay the goldens against the Rust core
        shell: bash
        run: |
          cargo build --release -p gitcraft-compat
          cd backend && uv sync --locked && cd ..
          PY=backend/.venv/bin/python
          [ -x "$PY" ] || PY=backend/.venv/Scripts/python.exe
          "$PY" tests/parity/parity.py check --server "$PWD/target/release/gitcraft-compat"
      - name: Build the installers
        working-directory: crates/gitcraft-ui
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1' # runners have no FUSE
        run: |
          cargo install cargo-packager --locked --version 0.11.8
          cargo packager --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: gitcraft-${{ matrix.os }}
          path: |
            target/release/gitcraft
            target/release/gitcraft.exe
            target/packages/*.deb
            target/packages/*.AppImage
            target/packages/*.dmg
            target/packages/*.exe
          if-no-files-found: error
