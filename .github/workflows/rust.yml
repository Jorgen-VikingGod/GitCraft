# Checks GitCraft on Linux, macOS and Windows: format, lints and tests.
# The installers are built by release.yml, when a release is published.
name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04 }
          - { os: macos-latest }
          - { os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ matrix.os }}-
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Lint
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --no-fail-fast
