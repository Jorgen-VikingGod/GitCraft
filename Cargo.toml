[workspace]
resolver = "3"
members = ["crates/gitcraft-core", "crates/gitcraft-ui"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Jürgen Könnemann"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# egui is far too slow to use unoptimised; the workspace's own crates stay quick to build.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
