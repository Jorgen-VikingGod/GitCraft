[workspace]
resolver = "3"
members = ["crates/gitcraft-core", "crates/gitcraft-ui"]

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Jürgen Könnemann"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
